name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy opencv-python-headless scikit-image pytest ruff
      - run: ruff check .
      - run: pytest
